
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101d3a">
    <title>Password Reset - WIN Business Suite</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f3f6fb;
            color: #17233c;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 460px;
            padding: 36px 30px;
            background: #fff;
            border: 1px solid #e4eaf2;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(16, 29, 58, .08);
        }

        .brand {
            margin-bottom: 28px;
            text-align: center;
            color: #101d3a;
            font-size: 25px;
            font-weight: 800;
        }

        .brand span { color: #13b9df; }

        h1 {
            margin: 0 0 12px;
            color: #101d3a;
            font-size: 25px;
            text-align: center;
        }

        .description {
            margin-bottom: 25px;
            color: #68758a;
            line-height: 1.6;
            font-size: 14px;
            text-align: center;
        }

        label {
            display: block;
            margin: 17px 0 7px;
            color: #253653;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d8e0eb;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #13b9df;
            box-shadow: 0 0 0 3px rgba(19, 185, 223, .12);
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #13b9df;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: .65;
        }

        #resetMessage {
            margin-top: 17px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .back-link {
            display: block;
            margin-top: 23px;
            text-align: center;
            color: #0786a7;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
        }

        .footer {
            margin-top: 28px;
            text-align: center;
            color: #8994a6;
            font-size: 12px;
            line-height: 1.7;
        }

        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand">WIN <span>Business Suite</span></div>

        <h1 id="pageTitle">Forgot your password?</h1>

        <p class="description" id="pageDescription">
            Enter your registered email address. We will send you a secure
            password-reset link that expires in 10 minutes.
        </p>

        <form id="requestResetForm">
            <label for="email">Email Address</label>
            <input
                id="email"
                type="email"
                autocomplete="email"
                placeholder="Enter your registered email"
                required
            >

            <button id="requestButton" type="submit">
                Send Reset Link
            </button>
        </form>

        <form id="completeResetForm" hidden>
            <label for="newPassword">New Password</label>
            <input
                id="newPassword"
                type="password"
                minlength="12"
                maxlength="128"
                autocomplete="new-password"
                placeholder="Enter your new password"
                required
            >

            <label for="confirmPassword">Confirm New Password</label>
            <input
                id="confirmPassword"
                type="password"
                minlength="12"
                maxlength="128"
                autocomplete="new-password"
                placeholder="Enter your new password again"
                required
            >

            <button id="completeButton" type="submit">
                Change Password
            </button>
        </form>

        <p id="resetMessage" role="status" aria-live="polite"></p>

        <a class="back-link" href="/login.html">Back to Login</a>

        <div class="footer">
            WIN Business Suite Team<br>
            Manage Everything. Grow Smarter.
        </div>
    </main>

    <script src="/js/password-reset.js"></script>
</body>
</html>
