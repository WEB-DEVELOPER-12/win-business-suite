
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales History | WIN Business Suite</title>

    <style>
        :root {
            --bg: #0b1220;
            --surface: #111c2e;
            --surface-light: #192941;
            --border: #263750;
            --text: #f4f8ff;
            --muted: #91a3bb;
            --cyan: #22c5e8;
            --green: #13c98a;
            --red: #ff6678;
            --orange: #ffbd66;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, Arial, sans-serif;
        }

        .page {
            width: min(100% - 30px, 1100px);
            margin: 0 auto;
            padding: 25px 0 45px;
        }

        .topbar {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .back {
            width: 43px;
            height: 43px;
            display: grid;
            place-items: center;
            border: 1px solid var(--border);
            border-radius: 13px;
            color: var(--text);
            text-decoration: none;
            font-size: 22px;
        }

        h1 { margin: 0; font-size: 24px; }

        .subtitle {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        .report-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(34, 197, 232, .25);
            border-radius: 17px;
            background: linear-gradient(120deg, #142b42, #111c2e);
        }

        .report-info h2 {
            margin: 0;
            font-size: 16px;
        }

        .report-info p {
            margin: 7px 0 0;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
        }

        .report-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input, select {
            min-height: 45px;
            padding: 0 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            background: var(--surface-light);
            color: var(--text);
            font: inherit;
            font-size: 13px;
        }

        input:focus, select:focus {
            border-color: var(--cyan);
        }

        input::placeholder { color: #71839b; }
        .download-button {
            min-height: 45px;
            padding: 0 16px;
            border: 0;
            border-radius: 10px;
            background: var(--cyan);
            color: #061521;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
            cursor: pointer;
        }

        .download-button:hover { filter: brightness(1.08); }

        .download-button:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .toolbar {
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr 1fr;
            gap: 12px;
            padding: 17px;
            border: 1px solid var(--border);
            border-radius: 17px;
            background: var(--surface);
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            color: #c3d0e0;
            font-size: 12px;
            font-weight: 650;
        }

        .field input, .field select { width: 100%; }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin: 20px 0;
        }

        .summary-card {
            padding: 17px;
            border: 1px solid var(--border);
            border-radius: 15px;
            background: var(--surface);
        }

        .summary-card span {
            color: var(--muted);
            font-size: 12px;
        }

        .summary-card strong {
            display: block;
            margin-top: 9px;
            font-size: 22px;
        }

        .section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 27px 0 14px;
        }

        .section-heading h2 {
            margin: 0;
            font-size: 17px;
        }

        .count {
            color: var(--muted);
            font-size: 12px;
        }

        .sales-list {
            display: grid;
            gap: 11px;
        }

        .sale-card {
            display: grid;
            grid-template-columns: 1.4fr 1fr 1fr 1fr auto;
            align-items: center;
            gap: 15px;
            padding: 17px;
            border: 1px solid var(--border);
            border-radius: 15px;
            background: var(--surface);
            transition: border-color .2s;
        }

        .sale-card:hover { border-color: #3c5b7c; }

        .sale-number {
            color: var(--cyan);
            font-size: 14px;
            font-weight: 750;
        }

        .sale-customer {
            margin-top: 5px;
            color: var(--muted);
            font-size: 12px;
        }

        .data-label {
            margin-bottom: 5px;
            color: var(--muted);
            font-size: 11px;
        }

        .data-value {
            font-size: 13px;
            font-weight: 650;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: capitalize;
        }

        .status.paid {
            background: rgba(19, 201, 138, .12);
            color: var(--green);
        }

        .status.partial {
            background: rgba(255, 189, 102, .12);
            color: var(--orange);
        }

        .status.unpaid {
            background: rgba(255, 102, 120, .12);
            color: var(--red);
        }

        .details-link {
            display: inline-block;
            padding: 10px 13px;
            border: 1px solid rgba(34, 197, 232, .3);
            border-radius: 10px;
            color: var(--cyan);
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
        }

        .details-link:hover {
            background: rgba(34, 197, 232, .08);
        }

        .empty, .loading, .error {
            padding: 35px 18px;
            border: 1px solid var(--border);
            border-radius: 15px;
            background: var(--surface);
            color: var(--muted);
            text-align: center;
            font-size: 13px;
            line-height: 1.6;
        }

        .error { color: #ff9aa6; }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-top: 22px;
        }

        .pagination button {
            min-height: 39px;
            padding: 0 15px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
        }

        .pagination button:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        #pageInfo {
            color: var(--muted);
            font-size: 12px;
        }

        @media (max-width: 850px) {
            .toolbar { grid-template-columns: 1fr 1fr; }

            .sale-card { grid-template-columns: 1fr 1fr; }

            .sale-card .sale-main { grid-column: 1 / -1; }

            .details-link { width: 100%; }

            .report-panel {
                align-items: flex-start;
                flex-direction: column;
            }
        }

        @media (max-width: 520px) {
            .page {
                width: min(100% - 22px, 1100px);
                padding-top: 18px;
            }

            .toolbar { grid-template-columns: 1fr; }

            .report-controls {
                width: 100%;
                flex-direction: column;
                align-items: stretch;
            }

            .report-controls select,
            .report-controls input,
            .download-button {
                width: 100%;
            }

            .summary { gap: 8px; }

            .summary-card { padding: 12px; }

            .summary-card strong { font-size: 16px; }

            .summary-card span { font-size: 10px; }

            .sale-card {
                gap: 13px 9px;
                padding: 14px;
            }
        }
    </style>
</head>

<body>
    <main class="page">

        <header class="topbar">
            <a href="/sales.html" class="back" aria-label="Back to Sale Centre">â†</a>

            <div>
                <h1>Sales History</h1>
                <p class="subtitle">View, search and review your sales records</p>
            </div>
        </header>

        

        <section class="toolbar">
            <div class="field">
                <label for="searchInput">Search sales</label>
                <input
                    id="searchInput"
                    type="search"
                    placeholder="Sale number or customer..."
                >
            </div>

            <div class="field">
                <label for="fromDate">From date</label>
                <input id="fromDate" type="date">
            </div>

            <div class="field">
                <label for="toDate">To date</label>
                <input id="toDate" type="date">
            </div>

            <div class="field">
                <label for="statusFilter">Payment status</label>
                <select id="statusFilter">
                    <option value="">All statuses</option>
                    <option value="paid">Paid</option>
                    <option value="partial">Partially paid</option>
                    <option value="unpaid">Unpaid</option>
                </select>
            </div>
        </section>

        <section class="summary">
            <div class="summary-card">
                <span>Sales displayed</span>
                <strong id="salesCount">â€”</strong>
            </div>

            <div class="summary-card">
                <span>Total sales value</span>
                <strong id="salesTotal">â€”</strong>
            </div>

            <div class="summary-card">
                <span>Outstanding balance</span>
                <strong id="outstandingTotal">â€”</strong>
            </div>
        </section>

        <div class="section-heading">
            <h2>Recorded transactions</h2>
            <span class="count" id="resultCount">Loading...</span>
        </div>

        <section id="salesList" class="sales-list">
            <div class="loading">Loading sales history...</div>
        </section>

        <div class="pagination">
            <button id="previousButton" type="button" disabled>Previous</button>
            <span id="pageInfo">Page 1</span>
            <button id="nextButton" type="button" disabled>Next</button>
        </div>

    </main>
    <script>
        const salesList = document.getElementById("salesList");
        const searchInput = document.getElementById("searchInput");
        const fromDate = document.getElementById("fromDate");
        const toDate = document.getElementById("toDate");
        const statusFilter = document.getElementById("statusFilter");
        const salesCount = document.getElementById("salesCount");
        const salesTotal = document.getElementById("salesTotal");
        const outstandingTotal = document.getElementById("outstandingTotal");
        const resultCount = document.getElementById("resultCount");

        const previousButton = document.getElementById("previousButton");
        const nextButton = document.getElementById("nextButton");
        const pageInfo = document.getElementById("pageInfo");

        const PAGE_SIZE = 20;
        const API_PAGE_SIZE = 100;

        let allSales = [];
        let filteredSales = [];
        let currentPage = 1;
        let searchTimer = null;

        // Default currency is KES until the saved business profile loads.
        let summaryCurrencyLabel = "KSh";

        function money(value) {
            const number = Number(value || 0);

            return (Number.isFinite(number) ? number : 0).toLocaleString("en-KE", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        // FIXED DATE DISPLAY
        // Date-only values remain on their original calendar date.
        // Actual timestamps continue displaying both date and time.
        function formatDate(value) {
            if (!value) return "Date unavailable";

            const text = String(value).trim();

            if (/^\d{4}-\d{2}-\d{2}$/.test(text)) {
                const [year, month, day] = text.split("-").map(Number);

                const date = new Date(year, month - 1, day);

                if (
                    date.getFullYear() !== year ||
                    date.getMonth() !== month - 1 ||
                    date.getDate() !== day
                ) {
                    return text;
                }

                return date.toLocaleDateString("en-KE", {
                    day: "numeric",
                    month: "short",
                    year: "numeric"
                });
            }

            const date = new Date(value);

            if (Number.isNaN(date.getTime())) {
                return text;
            }

            return date.toLocaleString("en-KE", {
                dateStyle: "medium",
                timeStyle: "short"
            });
        }

        function getDateOnly(value) {
            if (!value) return "";

            const text = String(value);

            if (/^\d{4}-\d{2}-\d{2}/.test(text)) {
                return text.slice(0, 10);
            }

            const date = new Date(value);

            if (Number.isNaN(date.getTime())) return "";

            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const day = String(date.getDate()).padStart(2, "0");

            return `${year}-${month}-${day}`;
        }

        function localDateString(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const day = String(date.getDate()).padStart(2, "0");

            return `${year}-${month}-${day}`;
        }

        function escapeHTML(value) {
            return String(value ?? "").replace(/[&<>"']/g, character => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            })[character]);
        }

        function getStatus(sale) {
            const status = String(sale.payment_status || "").toLowerCase();
            const balance = Number(sale.balance_due || 0);
            const paid = Number(sale.amount_paid || 0);

            if (status === "paid" || balance <= 0) {
                return "paid";
            }

            if (
                status === "partial" ||
                status === "partially_paid" ||
                paid > 0
            ) {
                return "partial";
            }

            return "unpaid";
        }

        function statusLabel(status) {
            if (status === "partial") return "Partially paid";
            if (status === "unpaid") return "Unpaid";
            return "Paid";
        }

        function extractSales(data) {
            if (Array.isArray(data)) return data;

            return data.sales ||
                data.results ||
                data.data ||
                [];
        }

        function getToday() {
            return localDateString(new Date());
        }

        async function apiGet(url) {
            const response = await fetch(url, {
                credentials: "same-origin"
            });

            if (response.status === 401) {
                window.location.href = "/login.html";
                throw new Error("Your session has expired.");
            }

            const data = await response.json();

            if (!response.ok || data.success === false) {
                throw new Error(data.message || "Unable to load sales.");
            }

            return data;
        }

        async function fetchSalesPages(startDate = "", endDate = "") {
            const sales = [];
            let page = 1;
            let totalPages = 1;

            do {
                const params = new URLSearchParams({
                    page: String(page),
                    limit: String(API_PAGE_SIZE)
                });

                if (startDate) params.set("start_date", startDate);
                if (endDate) params.set("end_date", endDate);

                const data = await apiGet(`/api/sales?${params.toString()}`);
                const pageSales = extractSales(data);

                sales.push(...pageSales);

                const pagination = data.pagination || {};

                if (pagination.total_pages !== undefined) {
                    totalPages = Math.max(
                        1,
                        Number(pagination.total_pages) || 1
                    );
                } else {
                    totalPages = pageSales.length === API_PAGE_SIZE
                        ? page + 1
                        : page;
                }

                page++;
            } while (page <= totalPages);

            return sales;
        }

        async function loadSales() {
            salesList.innerHTML = '<div class="loading">Loading sales history...</div>';

            try {
                allSales = await fetchSalesPages();

                /*
                 * Load the business currency for the webpage summary cards.
                 * If profile loading fails, keep the KSh fallback so that
                 * the sales history itself remains available.
                 */
                try {
                    const profile = await fetchBusinessProfile();
                    summaryCurrencyLabel = getCurrencyLabel(profile);
                } catch (profileError) {
                    console.warn(
                        "Could not load business currency. Using KSh fallback:",
                        profileError.message
                    );
                    summaryCurrencyLabel = "KSh";
                }

                currentPage = 1;
                applyFilters();

            } catch (error) {
                salesList.innerHTML = `
                    <div class="error">${escapeHTML(error.message)}</div>
                `;

                resultCount.textContent = "Unable to load";
            }
        }

        function applyFilters() {
            const search = searchInput.value.trim().toLowerCase();
            const start = fromDate.value;
            const end = toDate.value;
            const selectedStatus = statusFilter.value;

            filteredSales = allSales.filter(sale => {
                const saleNumber = String(
                    sale.sale_number || ""
                ).toLowerCase();

                const customer = String(
                    sale.customer_name || ""
                ).toLowerCase();

                const matchesSearch =
                    !search ||
                    saleNumber.includes(search) ||
                    customer.includes(search);

                const saleDate = getDateOnly(sale.sale_date);

                const matchesStart = !start || saleDate >= start;
                const matchesEnd = !end || saleDate <= end;

                const matchesStatus =
                    !selectedStatus ||
                    getStatus(sale) === selectedStatus;

                return matchesSearch &&
                    matchesStart &&
                    matchesEnd &&
                    matchesStatus;
            });

            currentPage = 1;
            renderSales();
        }

        function renderSales() {
            const totalPages = Math.max(
                1,
                Math.ceil(filteredSales.length / PAGE_SIZE)
            );

            if (currentPage > totalPages) currentPage = totalPages;

            const startIndex = (currentPage - 1) * PAGE_SIZE;

            const visibleSales = filteredSales.slice(
                startIndex,
                startIndex + PAGE_SIZE
            );

            const totalValue = filteredSales.reduce(
                (sum, sale) => sum + Number(sale.total_amount || 0),
                0
            );

            const totalOutstanding = filteredSales.reduce(
                (sum, sale) => sum + Number(sale.balance_due || 0),
                0
            );

            salesCount.textContent = filteredSales.length;
            salesTotal.textContent =
                `${summaryCurrencyLabel} ${money(totalValue)}`;

            outstandingTotal.textContent =
                `${summaryCurrencyLabel} ${money(totalOutstanding)}`;

            resultCount.textContent =
                `${filteredSales.length} transaction${filteredSales.length === 1 ? "" : "s"}`;

            pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;

            previousButton.disabled = currentPage <= 1;
            nextButton.disabled = currentPage >= totalPages;

            if (visibleSales.length === 0) {
                salesList.innerHTML = `
                    <div class="empty">
                        <strong>No sales found</strong><br>
                        No transactions match your current search or filters.
                    </div>
                `;
                return;
            }

            salesList.innerHTML = visibleSales.map(sale => {
                const status = getStatus(sale);

                const saleNumber = escapeHTML(
                    sale.sale_number || `Sale #${sale.id}`
                );

                const customer = escapeHTML(
                    sale.customer_name || "Walk-in customer"
                );

                const saleId = encodeURIComponent(sale.id);

                return `
                    <article class="sale-card">
                        <div class="sale-main">
                            <div class="sale-number">${saleNumber}</div>
                            <div class="sale-customer">${customer}</div>
                            <div class="sale-customer">
                                ${escapeHTML(formatDate(sale.sale_date))}
                            </div>
                        </div>

                        <div>
                            <div class="data-label">Total amount</div>
                            <div class="data-value">
                                ${escapeHTML(summaryCurrencyLabel)} ${money(sale.total_amount)}
                            </div>
                        </div>

                        <div>
                            <div class="data-label">Amount paid</div>
                            <div class="data-value">
                                ${escapeHTML(summaryCurrencyLabel)} ${money(sale.amount_paid)}
                            </div>
                        </div>

                        <div>
                            <div class="data-label">Payment status</div>
                            <span class="status ${status}">
                                ${statusLabel(status)}
                            </span>
                        </div>

                        <a
                            class="details-link"
                            href="/sale-details.html?id=${saleId}"
                        >
                            View details
                        </a>
                    </article>
                `;
            }).join("");
        }

        /*
         * BUSINESS PROFILE
         */

        async function fetchBusinessProfile() {
            const data = await apiGet("/api/business-settings");

            if (!data.business) {
                throw new Error("Business profile information was not returned.");
            }

            return data.business;
        }

        function getCurrencyLabel(profile) {
            const currency = String(profile?.currency || "KES").trim();

            if (!currency) return "KES";

            if (currency.toUpperCase() === "KES") return "KSh";

            return currency;
        }

        function formatCurrency(value, profile) {
            return `${getCurrencyLabel(profile)} ${money(value)}`;
        }

        searchInput.addEventListener("input", () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(applyFilters, 200);
        });

        fromDate.addEventListener("change", applyFilters);
        toDate.addEventListener("change", applyFilters);
        statusFilter.addEventListener("change", applyFilters);
        previousButton.addEventListener("click", () => {
            if (currentPage > 1) {
                currentPage--;
                renderSales();
            }
        });

        nextButton.addEventListener("click", () => {
            const totalPages = Math.ceil(
                filteredSales.length / PAGE_SIZE
            );

            if (currentPage < totalPages) {
                currentPage++;
                renderSales();
            }
        });
        loadSales();
    </script>
</body>
</html>
