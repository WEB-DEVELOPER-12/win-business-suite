
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101d3a">
    <title>Verify Email - WIN Business Suite</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f3f6fb;
            color: #17233c;
            font-family: Arial, sans-serif;
        }

        .verification-card {
            width: 100%;
            max-width: 460px;
            padding: 36px 30px;
            background: #ffffff;
            border: 1px solid #e4eaf2;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 12px 35px rgba(16, 29, 58, 0.08);
        }

        .brand {
            margin-bottom: 28px;
            color: #101d3a;
            font-size: 25px;
            font-weight: 800;
        }

        .brand span {
            color: #13b9df;
        }

        .icon {
            width: 72px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 22px;
            border-radius: 50%;
            background: #e8f8fc;
            color: #0795b7;
            font-size: 34px;
        }

        h1 {
            margin: 0 0 14px;
            color: #101d3a;
            font-size: 25px;
        }

        p {
            color: #68758a;
            line-height: 1.6;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 15px 20px;
            border: none;
            border-radius: 9px;
            background: #13b9df;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #079fc2;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.65;
        }

        #verificationMessage {
            margin-top: 18px;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .back-link {
            display: inline-block;
            margin-top: 24px;
            color: #0786a7;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 28px;
            color: #8994a6;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <main class="verification-card">
        <div class="brand">WIN <span>Business Suite</span></div>

        <div class="icon" aria-hidden="true">✉</div>

        <h1>Verify your email address</h1>

        <p>
            Confirm your email address to activate email verification
            for your WIN Business Suite account.
        </p>

        <button id="verifyButton" type="button">
            Verify Email Address
        </button>

        <p id="verificationMessage" role="status" aria-live="polite">
            Your verification link is valid for 10 minutes.
        </p>

        <a class="back-link" href="/login.html">Back to Login</a>

        <div class="footer">
            WIN Business Suite Team<br>
            Manage Everything. Grow Smarter.
        </div>
    </main>

    <script src="/js/verify-email.js"></script>
</body>
</html>
