<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | WIN Business Suite</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/app-pages.css">
</head>
<body>

    <header class="navbar">
        <a href="/" class="logo">WIN BUSINESS SUITE</a>
    </header>

    <main class="auth-container">
        <section class="auth-card">
            <h1>Welcome Back</h1>
            <p>Log in to manage your business.</p>

            <form id="loginForm">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="username"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" class="btn-primary" id="loginButton">
                    Log In
                </button>

                <p id="loginMessage" role="status" aria-live="polite"></p>
            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="/register.html">Create Account</a>
            </p>

            <a href="/" class="back-link">← Back to Home</a>
        </section>
    </main>

    <script src="/js/login.js"></script>
</body>
</html>
