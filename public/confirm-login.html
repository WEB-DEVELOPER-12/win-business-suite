
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101d3a">
    <title>Confirm Login - WIN Business Suite</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f3f6fb;
            color: #17233c;
            font-family: Arial, sans-serif;
        }

        .confirmation-card {
            width: 100%;
            max-width: 460px;
            padding: 36px 30px;
            background: #ffffff;
            border: 1px solid #e4eaf2;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 12px 35px rgba(16, 29, 58, 0.08);
        }

        .brand {
            margin-bottom: 28px;
            color: #101d3a;
            font-size: 25px;
            font-weight: 800;
        }

        .brand span {
            color: #13b9df;
        }

        .icon {
            width: 72px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 22px;
            border-radius: 50%;
            background: #e8f8fc;
            color: #0795b7;
            font-size: 34px;
        }

        h1 {
            margin: 0 0 14px;
            color: #101d3a;
            font-size: 25px;
        }

        p {
            color: #68758a;
            line-height: 1.6;
            font-size: 15px;
        }

        .email-display {
            margin: 18px 0;
            padding: 12px;
            border-radius: 8px;
            background: #f3f6fb;
            color: #17233c;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        label {
            display: block;
            margin: 20px 0 8px;
            text-align: left;
            color: #17233c;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 9px;
            text-align: center;
        }

        input:focus {
            outline: 2px solid #13b9df;
            border-color: #13b9df;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 15px 20px;
            border: none;
            border-radius: 9px;
            background: #13b9df;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover:not(:disabled) {
            background: #079fc2;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.65;
        }

        #resendLoginCodeButton {
            margin-top: 10px;
            background: #101d3a;
        }

        #resendLoginCodeButton:hover:not(:disabled) {
            background: #20365f;
        }

        #confirmationMessage {
            margin-top: 18px;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .back-link {
            display: inline-block;
            margin-top: 24px;
            color: #0786a7;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 28px;
            color: #8994a6;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <main class="confirmation-card">
        <div class="brand">WIN <span>Business Suite</span></div>

        <div class="icon" aria-hidden="true">🔐</div>

        <h1>Confirm Your Login</h1>

        <p>
            Enter the six-digit confirmation code sent to your email
            address to complete your login.
        </p>

        <div class="email-display" id="confirmationEmail">
            Loading email address...
        </div>

        <form id="confirmLoginForm">
            <label for="confirmationCode">Six-Digit Confirmation Code</label>

            <input
                type="text"
                id="confirmationCode"
                name="code"
                inputmode="numeric"
                autocomplete="one-time-code"
                pattern="[0-9]{6}"
                minlength="6"
                maxlength="6"
                placeholder="000000"
                aria-label="Six-digit confirmation code"
                required
            >

            <button id="confirmLoginButton" type="submit">
                Confirm Login
            </button>
        </form>

        <button id="resendLoginCodeButton" type="button">
            Resend Code
        </button>

        <p id="confirmationMessage" role="status" aria-live="polite">
            Your code expires after 10 minutes and can only be used once.
        </p>

        <a class="back-link" href="/login.html">Back to Login</a>

        <div class="footer">
            WIN Business Suite Team<br>
            Manage Everything. Grow Smarter.
        </div>
    </main>

    <script src="/js/confirm-login.js"></script>
</body>
</html>
